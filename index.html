<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7447e1">
    <title>Equipos en stock · ELIONTech</title>
    <link rel="stylesheet" href="public/styles.css">
</head>
<body>
    <main class="catalog">
        <header class="brand-header">
            <img src="public/logo/logo.png" alt="ELIONTech · Apple house importados">
        </header>
        <section class="inventory">
            <div class="section-heading"><div><p class="eyebrow">CATÁLOGO</p><h1>Equipos <span>en stock</span></h1></div><span class="stock-note"><i></i> STOCK ACTUAL</span></div>
            <div class="phone-list">
                <article class="phone-card"><div class="phone-icon"><span></span></div><div class="phone-info"><h3>iPhone 16 Pro</h3><p>128 GB · Negro</p></div><span class="status available">Disponible</span></article>
                <article class="phone-card is-sold-out"><div class="phone-icon"><span></span></div><div class="phone-info"><h3>iPhone 11</h3><p>64 GB · Amarillo</p></div><span class="status sold-out">No disponible</span></article>
                <article class="phone-card is-sold-out"><div class="phone-icon"><span></span></div><div class="phone-info"><h3>iPhone 12</h3><p>64 GB · Negro</p></div><span class="status sold-out">No disponible</span></article>
                <article class="phone-card is-sold-out"><div class="phone-icon"><span></span></div><div class="phone-info"><h3>iPhone 13 Pro</h3><p>128 GB · Gold</p></div><span class="status sold-out">No disponible</span></article>
            </div>
        </section>
        <footer><a href="https://instagram.com/eliontech.iphone/" target="_blank" rel="noreferrer">Consultar y reservar por Instagram <span>→</span></a></footer>
    </main>
</body>
</html>
